<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize – Moudrost dne</title><style>:root{font-family:system-ui,"Segoe UI",sans-serif;color:#19364d;background:#eff6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:clamp(16px,3vw,40px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}h1{margin:6px 0;font-size:clamp(28px,4vw,45px)}.eyebrow{font-weight:800;color:#008f9e;letter-spacing:.12em;font-size:12px}.card{background:#fff;border:1px solid #dae9ef;border-radius:22px;padding:25px;box-shadow:0 8px 30px #133c5610;margin-bottom:16px}.hero{background:linear-gradient(115deg,#0874b8,#00a995);color:#fff;border-radius:24px;padding:clamp(25px,5vw,60px)}.hero h2{font-size:clamp(30px,5vw,58px);line-height:1.2}.muted{color:#607c90}.btn{display:inline-block;background:linear-gradient(115deg,#0874b8,#00a995);color:white;border:0;border-radius:11px;padding:12px 18px;text-decoration:none;cursor:pointer;font:700 15px system-ui}.secondary{background:#e5f0f5;color:#17526b}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea{font:inherit;padding:10px;border:1px solid #bbd3df;border-radius:9px;width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}small{color:#688397}footer{margin-top:30px;color:#7891a3;font-size:12px;text-align:right}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · MOUDROST DNE</div><h1>Moudrost dne</h1></div><a class="btn secondary" href="config.html">Administrace</a></header><section class="hero"><div id="topic"></div><h2 id="quote"></h2><p id="english" style="font-size:clamp(18px,2.3vw,26px);opacity:.9"></p><p id="source" style="opacity:.75"></p></section><footer>Eduvize · Ukázkový výběr přísloví</footer></main><script>const KEY='eduvize-wisdom-v1',DEFAULT={language:'cs',bilingual:true,topic:'all',interval:30};function settings(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY))}}catch{return {...DEFAULT}}}const quotes=[{"en":"The journey of a thousand miles begins with a single step.","cs":"I cesta dlouhá tisíc mil začíná jediným krokem.","sk":"Aj cesta dlhá tisíc míľ sa začína jediným krokom.","source":"Tradiční rčení","topic":"motivace"},{"en":"Practice makes perfect.","cs":"Cvičení dělá mistra.","sk":"Cvičenie robí majstra.","source":"Tradiční přísloví","topic":"vzdělávání"},{"en":"Where there is a will, there is a way.","cs":"Kde je vůle, tam je cesta.","sk":"Kde je vôľa, tam je cesta.","source":"Tradiční přísloví","topic":"motivace"},{"en":"Knowledge is power.","cs":"Vědění je moc.","sk":"Vedomosti sú moc.","source":"Tradiční rčení","topic":"vzdělávání"},{"en":"Actions speak louder than words.","cs":"Činy mluví hlasitěji než slova.","sk":"Činy hovoria hlasnejšie než slová.","source":"Tradiční přísloví","topic":"život"},{"en":"Better late than never.","cs":"Lepší pozdě než nikdy.","sk":"Radšej neskoro ako nikdy.","source":"Tradiční přísloví","topic":"život"}];const cfg=settings();let index=-1;function draw(){const list=quotes.filter(q=>cfg.topic==='all'||q.topic===cfg.topic);if(!list.length)return;index=(index+1)%list.length;const q=list[index];document.getElementById('topic').textContent=q.topic.toUpperCase();document.getElementById('quote').textContent=q[cfg.language]||q.cs;document.getElementById('english').textContent=cfg.bilingual?q.en:'';document.getElementById('source').textContent=q.source}draw();if(cfg.interval>0)setInterval(draw,Math.max(5,cfg.interval)*1000);</script></body></html>
