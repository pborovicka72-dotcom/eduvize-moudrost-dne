<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize – Moudrost dne</title><style>:root{font-family:system-ui,"Segoe UI",sans-serif;color:#19364d;background:#eff6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:clamp(16px,3vw,40px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}h1{margin:6px 0;font-size:clamp(28px,4vw,45px)}.eyebrow{font-weight:800;color:#008f9e;letter-spacing:.12em;font-size:12px}.card{background:#fff;border:1px solid #dae9ef;border-radius:22px;padding:25px;box-shadow:0 8px 30px #133c5610;margin-bottom:16px}.hero{background:linear-gradient(115deg,#0874b8,#00a995);color:#fff;border-radius:24px;padding:clamp(25px,5vw,60px)}.hero h2{font-size:clamp(30px,5vw,58px);line-height:1.2}.muted{color:#607c90}.btn{display:inline-block;background:linear-gradient(115deg,#0874b8,#00a995);color:white;border:0;border-radius:11px;padding:12px 18px;text-decoration:none;cursor:pointer;font:700 15px system-ui}.secondary{background:#e5f0f5;color:#17526b}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea{font:inherit;padding:10px;border:1px solid #bbd3df;border-radius:9px;width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}small{color:#688397}footer{margin-top:30px;color:#7891a3;font-size:12px;text-align:right}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · MOUDROST DNE</div><h1>Moudrost dne</h1></div><a class="btn secondary" href="config.html">Administrace</a></header><section class="hero"><div id="topic"></div><h2 id="quote"></h2></section><footer id="attribution">Eduvize · Moudrost dne</footer></main><script>const KEY='eduvize-wisdom-v2',DEFAULT={language:'cs',topic:'all',interval:30};function settings(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY))}}catch{return {...DEFAULT}}}const cfg=settings();let quotes=[],index=-1;const quote=document.getElementById('quote'),source=document.getElementById('attribution'),topic=document.getElementById('topic');function draw(){const list=quotes.filter(q=>q.language===cfg.language&&(cfg.topic==='all'||q.topic===cfg.topic));if(!list.length){quote.textContent='Pro zvolený jazyk a téma zatím nejsou dostupné citáty.';source.textContent='Eduvize · Moudrost dne';topic.textContent='';return}index=(index+1)%list.length;const q=list[index];quote.textContent=q.text;topic.textContent=q.topic||'MOUDROST DNE';source.replaceChildren();const parts=[q.author||'Autor neuveden',q.work_title?'Dílo: '+q.work_title:(q.source||'Tradiční lidová slovesnost')];source.append(document.createTextNode(parts.join(' · ')));function link(url,label){try{const u=new URL(url);if(u.protocol!=='https:')return;const permitted=['cs.wikisource.org','sk.wikisource.org','cs.wikiquote.org','sk.wikiquote.org','creativecommons.org'];if(!permitted.includes(u.hostname))return;source.append(document.createTextNode(' · '));const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;source.append(a)}catch{}}if(q.source_url)link(q.source_url,'Původní dílo');if(q.rights||q.license){source.append(document.createTextNode(' · Licence: '+(q.rights||q.license)));if(q.license_url)link(q.license_url,'Podmínky licence')}if(q.modified)source.append(document.createTextNode(' · Text upraven'));}fetch('data/approved.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{quotes=Array.isArray(d)?d:[];draw()}).catch(()=>quote.textContent='Schválené citáty se nepodařilo načíst.');if(cfg.interval>0)setInterval(()=>{if(quotes.length)draw()},Math.max(5,cfg.interval)*1000);</script></body></html>
