name: Update licence-verified Wikiquote citations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update licence-verified quotes only
        run: python scripts/import_wikiquote.py
      - name: Commit automatically eligible quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved.json
          git diff --cached --quiet || (git commit -m "Publish licence-verified Wikiquote content" && git push)
