name: Import Wikicitáty for review
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import category candidates
        run: python scripts/import_wikiquote.py
      - name: Commit pending candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json
          git diff --cached --quiet || (git commit -m "Queue Wikiquote candidates for review" && git push)
