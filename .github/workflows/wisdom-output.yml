name: Wisdom published output
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-admin
          ref: 162cd485b4b1150a207a7c1c32344b990c2f9933
          path: .core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build . ./.core
      - run: python -m unittest discover -s tests -p 'test_output_adapter.py' -v
      - run: node tests/published.test.mjs
      - run: python -m build --wheel
      - name: Validate packaged approved data
        run: |
          python -m venv /tmp/wisdom-wheel
          /tmp/wisdom-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wisdom-wheel/bin/python -c "from eduvize_wisdom.output_adapter import catalog; assert len(catalog()[0]) > 100"
