name: Import licence-verified Wikisource works
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import works with explicit compatible licences
        run: python scripts/import_wikisource.py
      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved.json
          git diff --cached --quiet || (git commit -m "Import licence-verified Wikisource works" && git push)
