<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfigurace – Moudrost dne</title><style>:root{font-family:system-ui,"Segoe UI",sans-serif;color:#19364d;background:#eff6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:clamp(16px,3vw,40px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}h1{margin:6px 0;font-size:clamp(28px,4vw,45px)}.eyebrow{font-weight:800;color:#008f9e;letter-spacing:.12em;font-size:12px}.card{background:#fff;border:1px solid #dae9ef;border-radius:22px;padding:25px;box-shadow:0 8px 30px #133c5610;margin-bottom:16px}.hero{background:linear-gradient(115deg,#0874b8,#00a995);color:#fff;border-radius:24px;padding:clamp(25px,5vw,60px)}.hero h2{font-size:clamp(30px,5vw,58px);line-height:1.2}.muted{color:#607c90}.btn{display:inline-block;background:linear-gradient(115deg,#0874b8,#00a995);color:white;border:0;border-radius:11px;padding:12px 18px;text-decoration:none;cursor:pointer;font:700 15px system-ui}.secondary{background:#e5f0f5;color:#17526b}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea{font:inherit;padding:10px;border:1px solid #bbd3df;border-radius:9px;width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}small{color:#688397}footer{margin-top:30px;color:#7891a3;font-size:12px;text-align:right}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · MOUDROST DNE</div><h1>Konfigurace</h1></div><a class="btn" href="index.html" target="_blank">Otevřít aplikaci</a></header><section class="card"><label>Jazyk citátů</label><select id="language"><option value="cs">Čeština</option><option value="sk">Slovenština</option></select><label>Věková skupina</label><select id="audience"><option value="all">Univerzální – všechny školy</option><option value="primary">Základní škola</option><option value="secondary">Střední škola</option></select><label>Téma</label><select id="topic"><option value="all">Všechna témata</option><option value="Přísloví">Přísloví</option><option value="Moudrost">Moudrost</option><option value="Přátelství">Přátelství</option><option value="Vzdělání">Vzdělání</option><option value="Osobnosti">Citáty osobností</option><option value="Věda">Věda a objevy</option><option value="Humor">Humor</option><option value="Odvaha">Odvaha</option><option value="Príslovia">Príslovia</option><option value="Múdrosť">Múdrosť</option><option value="Priateľstvo">Priateľstvo</option><option value="Vzdelanie">Vzdelanie</option></select><label>Interval střídání (sekundy)</label><input id="interval" type="number" min="5" max="3600"><p><button class="btn" id="save">Uložit</button></p><p id="status" role="status"></p><small>Zobrazují se školně vhodné výroky; historické zemědělské pranostiky jsou mimo běžný výběr. Neprobíhá žádné ruční schvalování ani překlad. Nastavení je lokální pro tento prohlížeč.</small></section></main><script>const KEY='eduvize-wisdom-v2',DEFAULT={audience:'all',language:'cs',topic:'all',interval:30};let s;try{s={...DEFAULT,...JSON.parse(localStorage.getItem(KEY))}}catch{s={...DEFAULT}}for(const k of ['language','audience','topic','interval'])document.getElementById(k).value=s[k];document.getElementById('save').onclick=()=>{const n={audience:document.getElementById('audience').value,language:document.getElementById('language').value,topic:document.getElementById('topic').value,interval:Number(document.getElementById('interval').value)};localStorage.setItem(KEY,JSON.stringify(n));document.getElementById('status').textContent='Nastavení uloženo.'};</script></body></html>
